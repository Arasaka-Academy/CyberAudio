name: Release DMG
run-name: DMG ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build macOS arm64 DMG
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build and verify DMG
        run: bash scripts/build_dmg.sh "$RELEASE_TAG"

      - name: Upload DMG and checksum
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CyberAudio-${{ github.event.release.tag_name }}-macOS-arm64
          path: |
            dist/CyberAudio-*.dmg
            dist/CyberAudio-*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '## CyberAudio %s\n\n[Download DMG and SHA-256](%s)\n\nApple Silicon · macOS 26+ · artifact retention: 90 days\n' \
            "$RELEASE_TAG" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
