name: Release macOS app and updates
run-name: CyberAudio ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cyberaudio-release-feed
  cancel-in-progress: false

jobs:
  build:
    name: Sign and publish release assets
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      CYBERAUDIO_SIGN_MODE: ${{ vars.CYBERAUDIO_SIGN_MODE || 'adhoc' }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Select Swift 6.3.3 for native Qwen
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: "6.3.3"

      - name: Set up locked development tools
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install FFmpeg for native protocol tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Guard stable feed against version rollback
        if: ${{ !github.event.release.prerelease }}
        run: python3 scripts/release_updates.py check-feed --tag "$RELEASE_TAG"

      - name: Validate published release and stable channel classification
        run: python3 scripts/release_updates.py validate-release --tag "$RELEASE_TAG"

      - name: Read release notes
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.txt"

      - name: Validate native service and update behavior
        run: make check

      - name: Prepare isolated distribution keychain
        if: ${{ env.CYBERAUDIO_SIGN_MODE == 'distribution' }}
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, secrets, shlex, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          keychain = root / 'cyberaudio-signing.keychain-db'
          certificate = root / 'cyberaudio-signing.p12'
          def run(args):
              return subprocess.check_output(args, stderr=subprocess.STDOUT, text=True)
          try:
              names = ['DEVELOPER_ID_P12_BASE64', 'DEVELOPER_ID_P12_PASSWORD', 'APPLE_NOTARY_ID', 'APPLE_NOTARY_PASSWORD', 'APPLE_TEAM_ID']
              if any(not os.environ.get(name) for name in names):
                  raise ValueError('Distribution signing and notarization secrets are required')
              original = shlex.split(run(['security', 'list-keychains', '-d', 'user']))
              (root / 'cyberaudio-keychains-before.json').write_text(json.dumps(original))
              password = secrets.token_hex(32)
              run(['security', 'create-keychain', '-p', password, str(keychain)])
              run(['security', 'set-keychain-settings', '-lut', '7200', str(keychain)])
              run(['security', 'unlock-keychain', '-p', password, str(keychain)])
              run(['security', 'list-keychains', '-d', 'user', '-s', str(keychain), *original])
              certificate.touch(mode=0o600)
              certificate.write_bytes(base64.b64decode(os.environ['DEVELOPER_ID_P12_BASE64'], validate=True))
              run(['security', 'import', str(certificate), '-k', str(keychain), '-P', os.environ['DEVELOPER_ID_P12_PASSWORD'], '-T', '/usr/bin/codesign'])
              run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, str(keychain)])
              run(['xcrun', 'notarytool', 'store-credentials', 'cyberaudio-ci', '--keychain', str(keychain), '--apple-id', os.environ['APPLE_NOTARY_ID'], '--team-id', os.environ['APPLE_TEAM_ID'], '--password', os.environ['APPLE_NOTARY_PASSWORD']])
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'CYBERAUDIO_SIGN_KEYCHAIN={keychain}\n')
          except Exception:
              raise SystemExit('Distribution keychain preparation failed; check configured secrets and certificate validity') from None
          finally:
              certificate.unlink(missing_ok=True)
          PY

      - name: Build, sign and verify app, DMG, ZIP and feed
        env:
          CYBERAUDIO_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_SIGN_IDENTITY }}
          CYBERAUDIO_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CYBERAUDIO_NOTARY_PROFILE: ${{ env.CYBERAUDIO_SIGN_MODE == 'distribution' && 'cyberaudio-ci' || '' }}
        run: python3 scripts/release_updates.py build --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.txt"

      - name: Remove isolated distribution credentials
        if: ${{ always() && env.CYBERAUDIO_SIGN_MODE == 'distribution' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          saved = root / 'cyberaudio-keychains-before.json'
          if saved.exists():
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *json.loads(saved.read_text())], check=True)
          keychain = root / 'cyberaudio-signing.keychain-db'
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
          (root / 'cyberaudio-signing.p12').unlink(missing_ok=True)
          PY

      - name: Upload immutable assets and verify public downloads
        run: python3 scripts/release_updates.py upload --tag "$RELEASE_TAG"

      - name: Retain build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CyberAudio-${{ github.event.release.tag_name }}-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            dist/appcast.xml
            dist/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Stage stable update site
        if: ${{ !github.event.release.prerelease }}
        run: |
          mkdir -p .context/update-site
          cp dist/appcast.xml .context/update-site/appcast.xml
          touch .context/update-site/.nojekyll
          python3 -c 'from pathlib import Path; Path(".context/update-site/index.html").write_text("<!doctype html><meta charset=utf-8><title>CyberAudio Updates</title><a href=https://github.com/Arasaka-Academy/CyberAudio/releases>CyberAudio Releases</a>")'

      - name: Prepare Pages artifact after all release assets are verified
        if: ${{ !github.event.release.prerelease }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .context/update-site

  deploy-feed:
    name: Publish stable update feed
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Atomically publish verified feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
