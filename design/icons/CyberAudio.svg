<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">CyberAudio — Neon Signal</title>
  <desc id="description">An angular cyan C surrounding a magenta audio pulse on an obsidian macOS app tile.</desc>
  <defs>
    <linearGradient id="shell" x1="166" y1="104" x2="812" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="#293346"/>
      <stop offset=".34" stop-color="#121827"/>
      <stop offset="1" stop-color="#080B13"/>
    </linearGradient>
    <linearGradient id="face" x1="236" y1="128" x2="808" y2="908" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171E2D"/>
      <stop offset=".5" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#11101F"/>
    </linearGradient>
    <linearGradient id="edge" x1="188" y1="112" x2="838" y2="908" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4E5FF" stop-opacity=".38"/>
      <stop offset=".3" stop-color="#98B8D7" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#445279" stop-opacity=".06"/>
      <stop offset="1" stop-color="#E88BDF" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="cyan" x1="310" y1="260" x2="644" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDFFF7"/>
      <stop offset=".26" stop-color="#4FF8EB"/>
      <stop offset=".68" stop-color="#16D9DB"/>
      <stop offset="1" stop-color="#00A5BB"/>
    </linearGradient>
    <linearGradient id="pink" x1="554" y1="360" x2="708" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE5FF"/>
      <stop offset=".32" stop-color="#FF96EC"/>
      <stop offset=".64" stop-color="#FA4DD2"/>
      <stop offset="1" stop-color="#B72DAD"/>
    </linearGradient>
    <radialGradient id="cyanPool" cx="0" cy="0" r="1" gradientTransform="translate(300 352) rotate(53) scale(438 382)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05CEC8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#05CEC8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkPool" cx="0" cy="0" r="1" gradientTransform="translate(748 640) rotate(130) scale(344 322)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F62DC0" stop-opacity=".15"/>
      <stop offset="1" stop-color="#F62DC0" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#00030B" flood-opacity=".42"/>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="pinkGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tileClip"><rect x="104" y="104" width="816" height="816" rx="184"/></clipPath>
    <path id="c" d="M710 260 620 350H404L314 440V584L404 674H620L710 764H368L224 620V404L368 260Z"/>
    <g id="pulse">
      <path d="M422 440H458V584H422Z"/>
      <path d="M530 386H566V638H530Z"/>
      <path d="M638 440H674V584H638Z"/>
      <path d="M746 476H782V548H746Z"/>
    </g>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9BB8CB" fill-opacity=".09"/>
    </pattern>
  </defs>
  <rect x="104" y="104" width="816" height="816" rx="184" fill="url(#shell)" filter="url(#tileShadow)"/>
  <rect x="108" y="108" width="808" height="808" rx="180" fill="url(#face)"/>
  <g clip-path="url(#tileClip)">
    <rect x="104" y="104" width="816" height="816" fill="url(#cyanPool)"/>
    <rect x="104" y="104" width="816" height="816" fill="url(#pinkPool)"/>
    <path d="M104 104H920V920H104Z" fill="url(#grid)"/>
    <path d="M158 406V328L240 246H312M714 780H788L866 702V636" fill="none" stroke="#82C7D4" stroke-opacity=".12" stroke-width="2"/>
    <path d="M164 404V330L242 252H280" fill="none" stroke="#68EEE3" stroke-opacity=".18" stroke-width="2"/>
    <path d="M746 786H790L872 704V676" fill="none" stroke="#EF77D7" stroke-opacity=".19" stroke-width="2"/>
    <use xlink:href="#c" fill="#19E3D8" opacity=".31" filter="url(#cyanGlow)"/>
    <use xlink:href="#pulse" fill="#FA4DD2" opacity=".4" filter="url(#pinkGlow)"/>
    <use xlink:href="#c" transform="translate(0 9)" fill="#025563"/>
    <use xlink:href="#pulse" transform="translate(0 7)" fill="#702564"/>
    <use xlink:href="#c" fill="url(#cyan)" stroke="#A6FFF4" stroke-opacity=".35" stroke-width="1.5"/>
    <use xlink:href="#pulse" fill="url(#pink)" stroke="#FFE1FF" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M368 261H707M226 405 369 262" fill="none" stroke="#E1FFFB" stroke-opacity=".58" stroke-width="2"/>
    <path d="M532 388H564M640 442H672" fill="none" stroke="#FFF4FF" stroke-opacity=".7" stroke-width="2"/>
    <path d="M250 814H286M294 814H306" stroke="#52E7DD" stroke-opacity=".62" stroke-width="4"/>
    <path d="M752 210H774M782 210H794" stroke="#F285DC" stroke-opacity=".65" stroke-width="4"/>
  </g>
  <rect x="105" y="105" width="814" height="814" rx="183" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
