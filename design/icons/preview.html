<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberAudio · Cutline</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1e1517; color: #f4efed; font: 15px/1.7 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 1200px; margin: auto; padding: 52px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ffffff24; padding-bottom: 24px; }
  header img { width: 280px; height: auto; }
  .meta { color: #b5a8aa; font: 12px/1.5 Menlo, monospace; letter-spacing: 1px; }
  h1 { margin: 0 0 8px; font-size: 36px; font-weight: 550; letter-spacing: -1px; }
  h2 { margin: 0 0 16px; font-size: 17px; font-weight: 550; }
  p { margin: 0; color: #b5a8aa; }
  .hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 70px; padding: 48px 0; }
  .hero > img { width: 360px; height: 360px; justify-self: center; }
  .chip { display: inline-block; margin: 24px 8px 0 0; padding: 6px 12px; border: 1px solid #93e4ea55; color: #93e4ea; font: 12px Menlo, monospace; }
  .contexts { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid #ffffff24; }
  .bar { display: flex; align-items: center; justify-content: flex-end; height: 40px; gap: 24px; padding: 0 18px; }
  .bar img { width: 18px; height: 18px; }
  .bar.light { background: #cac6c5; color: #fff; }
  .bar.light img, .bar.dark img { filter: invert(1); }
  .bar.dark { background: #322c2e; color: #eee; }
  .caption { margin-top: 9px; color: #b5a8aa; font-size: 12px; }
  .sizes { display: flex; align-items: flex-end; gap: 32px; min-height: 148px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 9px; }
  figcaption { font: 11px Menlo, monospace; color: #b5a8aa; }
  footer { padding-top: 24px; border-top: 1px solid #ffffff24; display: flex; justify-content: space-between; color: #b5a8aa; font-size: 12px; }
  @media (max-width: 760px) { main { padding: 28px; } .hero, .contexts { grid-template-columns: 1fr; gap: 28px; } header img { width: 200px; } .hero > img { width: 280px; height: 280px; } }
</style>
<main>
  <header><img src="CyberAudio-wordmark.svg" alt="CyberAudio"><div class="meta">CUTLINE / B<br>0.4.4 · BUILD 11</div></header>
  <section class="hero">
    <img src="CyberAudio.png" alt="冰青 A 形与暖黑切角底板的 CyberAudio 应用图标">
    <div><h1>断讯 / Cutline</h1><p>沿用已选定的 Cyber 家族视觉。<br>独立 A 形、前倾字骨、横向断切。<br>从应用图标到菜单栏，共用同一轮廓。</p><span class="chip">ICE #93E4EA</span><span class="chip">WARM BLACK #1E1517</span></div>
  </section>
  <section class="contexts">
    <div><h2>菜单栏 · 18 pt</h2><div class="bar light"><img src="MenuBarIdle@2x.png" alt="待机"><img src="MenuBarActive@2x.png" alt="工作"><span>CyberAudio</span><span>13:20</span></div><div class="bar dark"><img src="MenuBarIdle@2x.png" alt="待机"><img src="MenuBarActive@2x.png" alt="工作"><span>CyberAudio</span><span>13:20</span></div><p class="caption">左：待机 · 右：工作状态圆点。浅色主题沿用白色图形规则。</p></div>
    <div><h2>应用图标 · 实际像素尺寸</h2><div class="sizes"><figure><img src="CyberAudio.iconset/icon_128x128.png" width="128" height="128" alt="128 px"><figcaption>128</figcaption></figure><figure><img src="CyberAudio.iconset/icon_32x32@2x.png" width="64" height="64" alt="64 px"><figcaption>64</figcaption></figure><figure><img src="CyberAudio.iconset/icon_32x32.png" width="32" height="32" alt="32 px"><figcaption>32</figcaption></figure><figure><img src="CyberAudio.iconset/icon_16x16.png" width="16" height="16" alt="16 px"><figcaption>16</figcaption></figure></div></div>
  </section>
  <footer><span>CyberAudio · Native macOS voice workspace</span><span>资产预览与菜单栏效果示意</span></footer>
</main>
</html>
